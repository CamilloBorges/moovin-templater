# Roda os testes e o build a cada push e pull request.
name: Testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Responsividade (Playwright): iPhones no WebKit, Samsung e computadores no Chromium
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:responsivo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-responsividade
          path: testes/relatorio
          retention-days: 14
