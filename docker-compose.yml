# EasyPanel (serviço Compose com fonte Git). O domínio aponta para o serviço "app", porta 3001.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_BANCO: templater
      COOKIE_SEGURO: "1"
      REMBG_URL: http://rembg:7000
      REMBG_MODELO: u2net
    expose:
      - "3001"
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-dados:/data/db
  # Remoção de fundo por IA (rembg, MIT), só na rede interna: o painel chama pelo servidor.
  # Modelos u2net (padrão, para logotipos) e isnet-general-use (fotos), de uso comercial livre,
  # baixados no primeiro uso e guardados no volume.
  # A imagem oficial já traz o bria-rmbg, que é de uso não comercial: não usar.
  rembg:
    image: danielgatis/rembg:2.0
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    restart: unless-stopped
    environment:
      U2NET_HOME: /modelos
    volumes:
      - rembg-modelos:/modelos
    mem_limit: 1536m
    expose:
      - "7000"
volumes:
  mongo-dados:
  rembg-modelos:
